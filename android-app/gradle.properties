# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
# PENTING: jangan set -Xmx terlalu besar. Nilai lama -Xmx2048m lebih besar dari
# total RAM banyak STB/VPS (2 GB), sehingga daemon Gradle di-kill OOM dan build
# gagal dengan "Gradle build daemon disappeared unexpectedly".
# 1024m cukup untuk assembleDebug proyek seukuran ini dan masih aman di RAM 2 GB.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
# Hemat RAM: satu worker saja, tanpa daemon yang menetap.
org.gradle.workers.max=1
org.gradle.daemon=false
# AGP 8.0.2 diuji sampai compileSdk 33; kita pakai 34. Peringatan ini tidak
# fatal, jadi diredam agar log build tetap bersih.
android.suppressUnsupportedCompileSdk=34
