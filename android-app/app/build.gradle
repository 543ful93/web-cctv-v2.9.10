plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// versionName dibaca dari package.json supaya APK tidak pernah tertinggal versi
// dari backend. Sebelumnya ditulis manual ("2.9.1") dan sudah melenceng.
def readAppVersion = {
    try {
        def pkg = new groovy.json.JsonSlurper().parse(new File("$rootDir/../package.json"))
        return pkg.version ?: "0.0.0"
    } catch (Exception e) {
        logger.warn("Gagal membaca versi dari package.json: ${e.message} — memakai 0.0.0")
        return "0.0.0"
    }
}
def appVersion = readAppVersion()

android {
    namespace 'com.webcctv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.webcctv.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName appVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Uji unit JVM untuk logika murni (UrlNormalizer). Tidak menyentuh API
    // Android sehingga berjalan cepat tanpa emulator.
    testImplementation 'junit:junit:4.13.2'
}
